name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Lint
        run: npm run test

  may-merge:
    needs: ["tests"]
    runs-on: ubuntu-latest
    steps:
      - name: Cleared for merging
        run: echo OK
